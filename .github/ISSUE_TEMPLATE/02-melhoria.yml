name: Melhoria
description: Uma ideia para o produto ficar melhor
labels: ["melhoria"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve
      description: |
        Comece pelo problema, não pela solução. "Não consigo X porque Y" ajuda
        mais do que "adicione um botão Z".
    validations: { required: true }
  - type: textarea
    id: quem
    attributes:
      label: Para quem
      description: Uma pessoa que não programa? Quem instala? Quem contribui com código?
    validations: { required: true }
  - type: textarea
    id: ideia
    attributes:
      label: Como você imagina que funcionaria
  - type: checkboxes
    id: leu
    attributes:
      label: Antes de enviar
      options:
        - label: Conferi no livro-razão (docs/MASTER_REQUIREMENTS_LEDGER.md) se já não está registrado como pendente
