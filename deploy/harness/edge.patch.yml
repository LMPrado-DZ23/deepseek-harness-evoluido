# Overlay loaded only when Caddy is the entry point. Values remain references
# or deployment facts; no secret value is stored in this file.
- insert:
    - id: dz23-studio-storage-postgres
      name: '@dz23-studio/storage-postgres'
      config:
        dsnRef: DZ23_POSTGRES_DSN
        schema: dz23_storage
        ssl: off
        poolMax: 4

- id: storage-domain
  config:
    backend: json
    routes:
      studio_hello: postgres
      studio_identity_users: postgres
      studio_identity_credentials: postgres
      studio_identity_sessions: postgres
      studio_identity_audit: postgres
      studio_orgs: postgres
      studio_workspaces: postgres
      studio_memberships: postgres
      studio_policy_audit: postgres
      studio_agent_runs: postgres
      studio_agent_leases: postgres
      studio_route_health: postgres

- id: connection
  config:
    trustedHosts:
      - !!js process.env.DZ23_PUBLIC_HOST

- id: dz23-studio-identity
  config:
    rpId: !!js process.env.DZ23_RP_ID
    expectedOrigin: !!js process.env.DZ23_PUBLIC_ORIGIN
    allowedHosts:
      - !!js process.env.DZ23_PUBLIC_HOST
    allowedOrigins:
      - !!js process.env.DZ23_PUBLIC_ORIGIN
    enrollment:
      mode: bootstrap-email
      email: !!js process.env.DZ23_BOOTSTRAP_OWNER_EMAIL
    edge:
      required: true
      secretRef: DZ23_EDGE_SECRET
    email:
      kind: smtp
      secretRef: DZ23_SMTP_SECRET
