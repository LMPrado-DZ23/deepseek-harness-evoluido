services:
  postgres-test:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: dz23_test
      POSTGRES_USER: dz23_test
      POSTGRES_PASSWORD: ${DZ23_POSTGRES_TEST_PASSWORD:?Defina uma senha descartavel para o teste}
    ports:
      - "127.0.0.1::5432"
    user: "70:70"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dz23_test -d dz23_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
      - /tmp:uid=70,gid=70,mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=0755
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
