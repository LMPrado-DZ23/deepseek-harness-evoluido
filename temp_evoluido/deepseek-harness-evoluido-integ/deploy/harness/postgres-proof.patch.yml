# P31-A runtime proof: keep official Harness domains on JSON and route only
# Studio-owned units to PostgreSQL.
- insert:
    - id: dz23-studio-storage-postgres
      name: '@dz23-studio/storage-postgres'
      config:
        dsnRef: DZ23_POSTGRES_DSN
        schema: !!js process.env.DZ23_POSTGRES_PROOF_SCHEMA ?? 'dz23_storage_proof'
        ssl: off
        poolMax: 4
        # Scheduled backup, enabled by the soak proof; empty = disabled in the plain runtime proof.
        backupDirectory: !!js process.env.DZ23_POSTGRES_BACKUP_DIR ?? ''
        backupIntervalMinutes: 5
        backupKeep: 6

- id: storage-domain
  config:
    backend: json
    routes:
      studio_hello: postgres
      studio_identity_users: postgres
      studio_identity_credentials: postgres
      studio_identity_sessions: postgres
      studio_identity_audit: postgres
      studio_orgs: postgres
      studio_workspaces: postgres
      studio_memberships: postgres
      studio_policy_audit: postgres
      studio_agent_runs: postgres
      studio_agent_leases: postgres
      studio_agent_teams: postgres
      studio_missions: postgres
      studio_route_health: postgres
      studio_staging_releases: postgres
      studio_action_approvals: postgres
      studio_emergency_stop: postgres
      studio_businesses: postgres
      studio_business_plans: postgres
      studio_business_tasks: postgres
      studio_business_offers: postgres
      studio_previews: postgres
      studio_preview_admissions: postgres
      studio_projects: postgres
      studio_app_specs: postgres
      studio_design_specs: postgres
      studio_intake_turns: postgres
      studio_plans: postgres
      studio_runs: postgres
      studio_evidence: postgres
      studio_approvals: postgres
      studio_creation_keys: postgres
      studio_integrations: postgres
      studio_integration_switches: postgres
