# Acrescimo OPCIONAL: o subagente `claude-code`.
#
# NAO faca parte do perfil publicado, e nao por acidente. Ele depende de
# `@anthropic-ai/claude-agent-sdk`, que e proprietario e nao redistribuivel;
# incluindo-o, nenhum artefato publico do DZ23 STUDIO pode ser gerado.
#
# Se VOCE tem licenca propria do SDK e quer o provedor `claude-code` na sua
# instalacao:
#
#   1. acrescente a dependencia ao seu perfil:
#      pnpm --dir dsh-home/profiles/studio add @deepseek-ai/dsh-subagent-claude-code
#   2. junte o bloco abaixo ao `cordis.patch.yml` do seu perfil, dentro do
#      mesmo `insert` em que estao os outros subagentes;
#   3. garanta que o executavel `claude` esta no PATH do processo do Harness.
#
# O produto ja lida com a ausencia dele: `providerStates()` devolve
# NOT_CONFIGURED quando o provedor nao esta registrado, e NOT_PRESENT quando
# esta registrado mas o executavel nao existe no PATH. Nenhuma tela quebra.
#
# Nao rode este arquivo como patch solto: ele e um TRECHO para colar, e nao um
# patch completo. Vale como documentacao executavel do que precisa existir.

- insert:
    - id: dz23-subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-code
        permissionMode: acceptEdits
        env: {}
