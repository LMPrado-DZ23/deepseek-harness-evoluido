packages:
  - plugins/*
  - apps/*
  - dsh-home/profiles/studio
  - third_party/deepseek-harness
  - third_party/deepseek-harness/apps/*
  - third_party/deepseek-harness/vendor/*
  - third_party/deepseek-harness/packages/*/*
  - third_party/deepseek-harness/native/landlock-run
  - third_party/deepseek-harness/native/landlock-run/packages/*

nodeLinker: hoisted
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
autoInstallPeers: false
overrides:
  # The pinned Harness source was compiled and reviewed against 0.84.2. Its
  # semver range now resolves to an incompatible catalog contract in 0.84.4.
  '@earendil-works/pi-ai': 0.84.2
allowBuilds:
  '@google/genai': false
  esbuild: true
  lefthook: false
  node-addon-require-builtin: false
  protobufjs: false
  sharp: true
  koffi: true
  node-pty: true
  # Modern deploy materializes this reviewed local package under an absolute
  # file URL. The image build replaces this inert placeholder with its fixed
  # /workspace path; the lock gate proves the resolution remains in-tree.
  '@deepseek-ai/dsh-subprocess-local@__DZ23_ABSOLUTE_FILE_ROOT__/third_party/deepseek-harness/packages/subprocess/subprocess-local': true
  '@deepseek-ai/dsh-subprocess-local@file:third_party/deepseek-harness/packages/subprocess/subprocess-local': true
