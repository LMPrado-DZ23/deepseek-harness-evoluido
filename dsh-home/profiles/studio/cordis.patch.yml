# DZ23 STUDIO production profile. Deterministic/fake providers live only in
# poc-01b.patch.yml and are never mounted by the release command.

# Telemetria comercial desligada NO PERFIL, e não só na imagem.
#
# O bundle upstream monta `session-telemetry-otel` em FEEDBACK_ONLY apontando
# para harness-telemetry.deepseeksvc.com, e o próprio comentário upstream diz
# que o export é a cópia crua da sessão, sem regra de redaction. Até aqui, a
# única coisa que impedia isso era `DSH_TELEMETRY_DISABLED=1` no Dockerfile —
# quem rodasse o perfil fora daquela imagem (desenvolvimento, prova, WSL)
# mandava conversa de cliente para um endpoint de terceiro sem saber.
#
# Um patch substitui o `config` inteiro da linha, então isto também apaga a
# URL do exportador. Em `DISABLED` o plugin não constrói pipeline nenhum e nem
# lê o endpoint. O `DSH_TELEMETRY_DISABLED` da imagem continua, como segunda
# tranca: aqui não se troca uma tranca por outra.
- id: session-telemetry-otel
  config:
    mode: DISABLED

# Skills empacotadas com o produto.
#
# A montagem NAO fica aqui. O bundle `dsh-web-app` desliga de proposito a linha
# de host `skill-filesystem` (e `tool-skill`) porque, nesta composicao, quem faz
# a descoberta local de skills e o PRESET do agente. Configurar a linha de host
# aqui nao teria efeito nenhum e ainda pareceria que teve: a linha continua
# `disabled` e a expressao nem chega a ser avaliada.
#
# A montagem real esta em dsh-home/.agent-presets/dz23-assistant/agent.cordis.yml.
# A licenca de cada skill de terceiro fica junto da copia, e as obrigacoes estao
# em dsh-home/skills/NOTICE. Marca nao e concedida por licenca de software: o
# nome de quem escreveu continua sendo de quem escreveu.

- id: agent-presets
  config:
    default: dz23-assistant
    roots: !!js >-
      process.env.DZ23_COORDINATOR_PRESET_ROOT
        ? [{ path: process.env.DZ23_COORDINATOR_PRESET_ROOT, trust: 'system' }]
        : []

# The official DeepSeek route is already supplied by dsh-base under its
# physical id `deepseek-official`. These two declared OpenAI-compatible routes
# add no second gateway and resolve every credential by reference.
- id: llm-pi-ai
  config:
    providers:
      omniroute:
        displayName: OmniRoute (externo opcional)
        api: openai-completions
        baseURL: !!js process.env.DZ23_OMNIROUTE_BASE_URL ?? 'http://127.0.0.1:20128/v1'
        apiKeyEnv: DZ23_OMNIROUTE_KEY
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: auto
            name: OmniRoute Auto
            contextWindow: 262144
            maxTokens: 32768
      ollama:
        displayName: Ollama local
        api: openai-completions
        baseURL: !!js process.env.DZ23_OLLAMA_BASE_URL ?? 'http://127.0.0.1:11434/v1'
        apiKeyEnv: DZ23_OLLAMA_PLACEHOLDER
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: !!js process.env.DZ23_OLLAMA_MODEL ?? 'qwen3-coder'
            name: Modelo local configurado
            contextWindow: 131072
            maxTokens: 32768

- insert:
    # Providers are registered but never exposed through the generic
    # tool-subagent. @dz23-studio/agents is the only approved entry point.
    - id: dz23-subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex
        permissionMode: approve-for-me
        env: {}
    # O subagente `claude-code` NAO entra no perfil publicado.
    #
    # Ele arrasta `@anthropic-ai/claude-agent-sdk`, que e proprietario e nao
    # redistribuivel: enquanto estivesse aqui, NENHUM artefato publico deste
    # projeto poderia ser gerado, qualquer que fosse a licenca do codigo
    # (`pnpm gate:licenses:release` reprova com essa mensagem).
    #
    # A capacidade nao foi apagada: o tipo `claude-code` continua no produto e
    # `providerStates()` passa a devolver NOT_CONFIGURED em vez de OK. Quem tem
    # licenca propria do SDK recoloca o subagente pelo acrescimo documentado em
    # `dsh-home/profiles/studio/optional/claude-code.patch.yml`.
    #
    # Decisao registrada na ADR-042 (pergunta 2 do requisito C-05).
    - id: dz23-subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn-in-process

- insert:
    - id: dz23-studio-policy
      name: '@dz23-studio/policy'
      config:
        requireAuthorizationDeclarations: true
        rules:
          bash:
            source:
              kind: harness
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          write:
            source:
              kind: harness
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_start:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_start_sensitive:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T3
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_list:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_agent_review:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_agent_cancel:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_apply:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          # Encerrar uma execução parada em UNKNOWN. T3 porque nenhuma prova
          # técnica sustenta a conclusão: quem decide é uma pessoa, com chave
          # de acesso e um motivo escrito que fica gravado no registro.
          studio_agent_resolve_unknown:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T3
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          # A-03: retomar um trabalho interrompido por reinicio. T2, o MESMO de
          # comecar um trabalho novo, porque e isso que acontece: um assistente
          # volta a escrever nos arquivos da pessoa. O que muda e de onde ele
          # parte. Os caminhos vem da reserva do trabalho retomado, nunca de
          # quem pede — retomar nao e a hora de ampliar o que ele pode escrever.
          studio_agent_resume:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_start:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_start_sensitive:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T3
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_list:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_team_status:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_team_continue:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_continue_sensitive:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T3
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_cancel:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
    - id: dz23-studio-identity
      name: '@dz23-studio/identity'
    - id: dz23-studio-tenancy
      name: '@dz23-studio/tenancy'
    # Autoridade genérica de confirmação de ações sensíveis
    # (ADR-039-generic-action-approval-authority). Precisa
    # vir ANTES de quem depende dela: sem este plugin montado, toda operação T3
    # do assistente recusa com NOT_CONFIGURED em vez de se autoconceder.
    - id: dz23-studio-action-approval
      name: '@dz23-studio/action-approval'
      config:
        # O Harness resolve `approval/request` SÓ com respondedores compostos no
        # mesmo processo: sem este, a pergunta cai no 'unavailable' fechado e a
        # pessoa nunca vê nada. Ligado aqui, a pergunta vira uma confirmação
        # real na autoridade do Studio. O Harness continua com zero diff.
        answerHarnessApprovals: true
        # Um pedido do Harness é sempre escalada de permissão (caixa, rede,
        # arquivo fora do escopo): exige chave de acesso recente na mesma sessão.
        harnessTier: T3
    - id: dz23-studio-agents
      name: '@dz23-studio/agents'
      config:
        coordinatorPreset: dz23-coordinator
        inProcessCoordinatorPreset: dz23-coordinator-in-process
        worktreeRoot: !!js process.env.DZ23_AGENT_WORKTREE_ROOT
    - id: dz23-studio-agent-team
      name: '@dz23-studio/agent-team'
    # Motor de missão. Vem DEPOIS de `agent-team` porque a dependência é
    # invertida: é este plugin que se apresenta ao serviço de equipes e instala
    # o teto da missão. Sem ele montado, uma equipe que declare missão é
    # RECUSADA — o padrão seguro é recusar, e não correr sem teto.
    - id: dz23-studio-mission
      name: '@dz23-studio/mission'
    - id: dz23-studio-route-health
      name: '@dz23-studio/route-health'
    - id: dz23-studio-prompt-to-app
      name: '@dz23-studio/prompt-to-app'
      config:
        runsRoot: /var/lib/dz23-studio/generated-runs
        logoStoreRoot: /var/lib/dz23-studio/assets
        builder:
          imageDigestFile: /var/lib/dz23-studio/builder-image-digest
          templateStore: /var/lib/dz23-studio/template-store-v2
    - id: dz23-studio-preview
      name: '@dz23-studio/preview'
      config:
        publicPort: !!js Number(process.env.DZ23_PUBLIC_PORT ?? '8080')
        runtimeTimeoutMs: 30000
        supervisor:
          enabled: !!js process.env.DZ23_PREVIEW_SUPERVISOR_ENABLED === '1'
          socketPath: !!js process.env.DZ23_PREVIEW_SUPERVISOR_SOCKET ?? '/run/dz23-preview/supervisor.sock'
          tokenFile: !!js process.env.DZ23_PREVIEW_SUPERVISOR_TOKEN_FILE ?? '/run/secrets/dz23_preview_supervisor_token'
          artifactRoot: !!js process.env.DZ23_RUNS_ROOT ?? '/var/lib/dz23-studio/generated-runs'
          proxySocketRoot: !!js process.env.DZ23_PREVIEW_PROXY_SOCKET_ROOT ?? '/run/dz23-preview-proxies'
          studioOrigin: !!js process.env.DZ23_PUBLIC_ORIGIN ?? 'http://studio.dz23.localhost:8080'
          edgeSecretRef: DZ23_EDGE_SECRET
    # Staging: a pasta onde a versao de teste do aplicativo e publicada.
    #
    # O destino e LOCAL na v1.0, e isso e uma decisao: um destino em rede exige
    # credencial, dominio e autorizacao que este produto nao tem, e um provedor
    # que fingisse publicar seria pior que a ausencia dele. O que este publica e
    # real e conferivel - os arquivos ficam la, imutaveis por geracao, com
    # recibo, e cada arquivo e conferido contra o manifesto atestado ANTES de
    # ser copiado.
    #
    # A raiz fica dentro de `$DSH_HOME`, que ja e onde o produto escreve tudo.
    # Exigir configuracao aqui deixaria a jornada quebrada por padrao sem ganho
    # de seguranca nenhum.
    - id: dz23-studio-staging
      name: '@dz23-studio/staging'
      config:
        root: !!js >-
          process.env.DZ23_STUDIO_STAGING_ROOT ?? `${process.env.DSH_HOME ?? '.'}/staging`
        targetRef: !!js process.env.DZ23_STUDIO_STAGING_TARGET ?? 'dz23-target:staging-local'
    - id: dz23-studio-integration-hub
      name: '@dz23-studio/integration-hub'
      config:
        # Public keys of trusted integration publishers (Ed25519 SPKI, base64). Empty = every manifest is unverified.
        publisherKeys: !!js JSON.parse(process.env.DZ23_HUB_PUBLISHER_KEYS ?? '{}')
        # Written here on purpose: an environment variable must not be able to lower the
        # policy of a running Studio. To develop with unsigned integrations, change this
        # line to `dev` in this file. A wrong signature is refused on either channel.
        # `dev` is only accepted on a PERSONAL installation: the Studio bound to loopback
        # and accepting only loopback hosts and origins. On anything reachable by somebody
        # else the Studio REFUSES TO START with `dev` instead of serving other people with
        # a lowered policy.
        channel: stable
        smtpTestEnabled: !!js process.env.DZ23_HUB_SMTP_TEST_ENABLED === '1'
        # Where the generated runs live. Only a run inside this folder can be packaged, and it
        # must match the runs root of the prompt-to-app plugin — both default to
        # ~/.dz23-studio/generated-runs. Written here, never read from the environment: this is
        # the export's only boundary, and a variable must not be able to move it.
        runsRoot: /var/lib/dz23-studio/generated-runs
        exportsRoot: /var/lib/dz23-studio/exports
    # Cliente MCP (X-11). Monta DEPOIS do hub de integrações, que é de quem ele
    # recebe a chamada — e sem quem ele nem sobe (`inject`).
    #
    # `servers` está vazio de propósito: cadastrar um servidor MCP é dizer que
    # ESTE computador concorda em executar aquele programa, e essa decisão é de
    # quem administra o Studio. Escrito aqui e nunca lido do ambiente, pelo
    # mesmo motivo do `channel` acima: uma variável de ambiente não pode
    # escolher qual programa o Studio executa. Vazio significa que toda chamada
    # MCP é recusada — e a recusa é auditada, não silenciosa.
    #
    # A chave de cada entrada é o `id` do manifesto ASSINADO da integração. Sem
    # manifesto com assinatura válida a conexão não acontece, cadastro ou não.
    - id: dz23-studio-mcp-client
      name: '@dz23-studio/mcp-client'
      config:
        servers: {}
    - id: dz23-studio-web
      name: '@dz23-studio/web'
      config:
        assistantRepositories: !!js JSON.parse(process.env.DZ23_ASSISTANT_REPOSITORIES ?? '[]')
