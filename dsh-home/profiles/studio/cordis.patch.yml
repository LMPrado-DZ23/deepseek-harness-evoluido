# DZ23 STUDIO production profile. Deterministic/fake providers live only in
# poc-01b.patch.yml and are never mounted by the release command.

- id: agent-presets
  config:
    default: dz23-assistant
    roots: !!js >-
      process.env.DZ23_COORDINATOR_PRESET_ROOT
        ? [{ path: process.env.DZ23_COORDINATOR_PRESET_ROOT, trust: 'system' }]
        : []

# The official DeepSeek route is already supplied by dsh-base under its
# physical id `deepseek-official`. These two declared OpenAI-compatible routes
# add no second gateway and resolve every credential by reference.
- id: llm-pi-ai
  config:
    providers:
      omniroute:
        displayName: OmniRoute (externo opcional)
        api: openai-completions
        baseURL: !!js process.env.DZ23_OMNIROUTE_BASE_URL ?? 'http://127.0.0.1:20128/v1'
        apiKeyEnv: DZ23_OMNIROUTE_KEY
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: auto
            name: OmniRoute Auto
            contextWindow: 262144
            maxTokens: 32768
      ollama:
        displayName: Ollama local
        api: openai-completions
        baseURL: !!js process.env.DZ23_OLLAMA_BASE_URL ?? 'http://127.0.0.1:11434/v1'
        apiKeyEnv: DZ23_OLLAMA_PLACEHOLDER
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: !!js process.env.DZ23_OLLAMA_MODEL ?? 'qwen3-coder'
            name: Modelo local configurado
            contextWindow: 131072
            maxTokens: 32768

- insert:
    # Providers are registered but never exposed through the generic
    # tool-subagent. @dz23-studio/agents is the only approved entry point.
    - id: dz23-subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex
        permissionMode: approve-for-me
        env: {}
    - id: dz23-subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-code
        permissionMode: acceptEdits
        env: {}
    - id: dz23-subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn-in-process

- insert:
    - id: dz23-studio-policy
      name: '@dz23-studio/policy'
      config:
        requireAuthorizationDeclarations: true
        rules:
          bash:
            source:
              kind: harness
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          write:
            source:
              kind: harness
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_start:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_start_sensitive:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T3
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_list:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_agent_review:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_agent_cancel:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_agent_apply:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_start:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_start_sensitive:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T3
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_list:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_team_status:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T0
            sandboxMode: read-only
            requiredPermission: project.read
            scope: project
          studio_team_continue:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_continue_sensitive:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T3
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
          studio_team_cancel:
            source: { kind: studio, external: false, stableChannel: true }
            inferredTier: T2
            sandboxMode: workspace-write
            requiredPermission: project.write
            scope: project
    - id: dz23-studio-identity
      name: '@dz23-studio/identity'
    - id: dz23-studio-tenancy
      name: '@dz23-studio/tenancy'
    # Autoridade genérica de confirmação de ações sensíveis (ADR-039). Precisa
    # vir ANTES de quem depende dela: sem este plugin montado, toda operação T3
    # do assistente recusa com NOT_CONFIGURED em vez de se autoconceder.
    - id: dz23-studio-action-approval
      name: '@dz23-studio/action-approval'
    - id: dz23-studio-agents
      name: '@dz23-studio/agents'
      config:
        coordinatorPreset: dz23-coordinator
        inProcessCoordinatorPreset: dz23-coordinator-in-process
        worktreeRoot: !!js process.env.DZ23_AGENT_WORKTREE_ROOT
    - id: dz23-studio-agent-team
      name: '@dz23-studio/agent-team'
    - id: dz23-studio-route-health
      name: '@dz23-studio/route-health'
    - id: dz23-studio-prompt-to-app
      name: '@dz23-studio/prompt-to-app'
      config:
        runsRoot: /var/lib/dz23-studio/generated-runs
        logoStoreRoot: /var/lib/dz23-studio/assets
        builder:
          imageDigestFile: /var/lib/dz23-studio/builder-image-digest
          templateStore: /var/lib/dz23-studio/template-store-v2
    - id: dz23-studio-preview
      name: '@dz23-studio/preview'
      config:
        publicPort: !!js Number(process.env.DZ23_PUBLIC_PORT ?? '8080')
        runtimeTimeoutMs: 30000
        supervisor:
          enabled: !!js process.env.DZ23_PREVIEW_SUPERVISOR_ENABLED === '1'
          socketPath: !!js process.env.DZ23_PREVIEW_SUPERVISOR_SOCKET ?? '/run/dz23-preview/supervisor.sock'
          tokenFile: !!js process.env.DZ23_PREVIEW_SUPERVISOR_TOKEN_FILE ?? '/run/secrets/dz23_preview_supervisor_token'
          artifactRoot: !!js process.env.DZ23_RUNS_ROOT ?? '/var/lib/dz23-studio/generated-runs'
          proxySocketRoot: !!js process.env.DZ23_PREVIEW_PROXY_SOCKET_ROOT ?? '/run/dz23-preview-proxies'
          studioOrigin: !!js process.env.DZ23_PUBLIC_ORIGIN ?? 'http://studio.dz23.localhost:8080'
          edgeSecretRef: DZ23_EDGE_SECRET
    - id: dz23-studio-integration-hub
      name: '@dz23-studio/integration-hub'
      config:
        # Public keys of trusted integration publishers (Ed25519 SPKI, base64). Empty = every manifest is unverified.
        publisherKeys: !!js JSON.parse(process.env.DZ23_HUB_PUBLISHER_KEYS ?? '{}')
        # Written here on purpose: an environment variable must not be able to lower the
        # policy of a running Studio. To develop with unsigned integrations, change this
        # line to `dev` in this file. A wrong signature is refused on either channel.
        # `dev` is only accepted on a PERSONAL installation: the Studio bound to loopback
        # and accepting only loopback hosts and origins. On anything reachable by somebody
        # else the Studio REFUSES TO START with `dev` instead of serving other people with
        # a lowered policy.
        channel: stable
        smtpTestEnabled: !!js process.env.DZ23_HUB_SMTP_TEST_ENABLED === '1'
        # Where the generated runs live. Only a run inside this folder can be packaged, and it
        # must match the runs root of the prompt-to-app plugin — both default to
        # ~/.dz23-studio/generated-runs. Written here, never read from the environment: this is
        # the export's only boundary, and a variable must not be able to move it.
        runsRoot: /var/lib/dz23-studio/generated-runs
        exportsRoot: /var/lib/dz23-studio/exports
    - id: dz23-studio-web
      name: '@dz23-studio/web'
      config:
        assistantRepositories: !!js JSON.parse(process.env.DZ23_ASSISTANT_REPOSITORIES ?? '[]')
