# Harness Studio PoC-01 profile layer. The profile manifest composes the exact
# official web stack first; this file changes only the default model route and
# inserts the out-of-tree Studio plugin.
- id: agent-default-model
  config:
    provider: studio-fake
    model: studio-deterministic

- insert:
    - id: dz23-studio-policy
      name: '@dz23-studio/policy'
    - id: dz23-studio-identity
      name: '@dz23-studio/identity'
    - id: studio-hello
      name: '@studio/hello'
