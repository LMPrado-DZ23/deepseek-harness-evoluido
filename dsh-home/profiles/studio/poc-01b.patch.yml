# PoC-only deterministic provider/tool. This file is never loaded by the
# production image command, and @studio/hello is a development-only dependency.
- id: agent-default-model
  config:
    provider: studio-fake
    model: studio-deterministic

- id: dz23-studio-policy
  config:
    rules:
      studio_echo:
        source:
          kind: studio
        inferredTier: T2
        sandboxMode: workspace-write
        requiredPermission: project.write
        scope: project

- id: dz23-studio-agents
  config:
    inProcessProvider: studio-fake
    inProcessModel: studio-deterministic

- insert:
    - id: studio-hello
      name: '@studio/hello'

# PoC-only explicit sandbox runner. The host profile probes the same pinned
# Bubblewrap binary; the absolute invocation also survives shell environment
# sanitization when the confined subprocess is spawned.
- id: sandbox
  config:
    runnerCommand:
      - !!js process.env.STUDIO_BWRAP_PATH
    runnerFailureSignatures:
      - 'bwrap:'
